name: Build Xiaomi 8 SE Kernel (LineageOS A14) - 最终修正 (带 Symlink)

on:
  push:
    branches:
      - lineage-21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_PATH: ${{ github.workspace }}/clang-toolchain
      
      # 核心编译变量：我们不再使用传统的 GCC 前缀
      # 而是依赖于 PATH 中的 LLVM 工具
      CROSS_COMPILE: 
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev \
            libncurses5-dev libelf-dev curl

      - name: ⬇️ 检出 LineageOS 内核源代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} 
          depth: 1 

      - name: 🛠️ 下载 AOSP Clang 工具链 (带 LLVM Binutils)
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android14-release $CLANG_PATH

      - name: 🛠️ PATH 设置 (将 Clang/LLVM Binutils 添加到路径)
        run: |
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      - name: 🛠️ 创建 Clang/LLVM 符号链接 (解决 GCC 依赖检查)
        run: |
          # 这一步是关键，它解决了 'aarch64-linux-gnu-gcc: command not found' 的问题
          CLANG_BIN="${{ env.CLANG_PATH }}/bin"
          ln -sf "$CLANG_BIN/clang" "$CLANG_BIN/aarch64-linux-gnu-gcc"
          ln -sf "$CLANG_BIN/ld.lld" "$CLANG_BIN/aarch64-linux-gnu-ld"
          ln -sf "$CLANG_BIN/llvm-ar" "$CLANG_BIN/aarch64-linux-gnu-ar"

      - name: 🛠️ 设置 LLVM Binutils 强制路径
        run: |
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AS=clang" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          
      - name: 🧹 清理构建目录 (应能通过 GCC 检查)
        run: |
          # 此时 make mrproper 应该能够通过 aarch64-linux-gnu-gcc 检查
          make O=out mrproper
        working-directory: ${{ env.KERNEL_DIR }}

      - name: ⚙️ 应用内核配置 (sdm670-perf_defconfig)
        run: |
          make O=out LLVM=1 sdm670-perf_defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        
      - name: 🩹 修正配置 (最终清理)
        run: |
          make O=out LLVM=1 silentoldconfig
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 🚀 编译内核 (调试模式：-j1)
        run: |
          # 使用 -j1 降低并行度，以防错误被隐藏
          make O=out LLVM=1 -j1 
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 📤 上传编译产物 (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-a14-kernel-xiaomi8se
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
