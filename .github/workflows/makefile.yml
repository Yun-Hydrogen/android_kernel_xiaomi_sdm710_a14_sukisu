name: Build Xiaomi 8 SE Kernel (LineageOS A14)

on:
  push:
    branches:
      - lineage-21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_PATH: ${{ github.workspace }}/clang-toolchain
      GCC_PATH_AARCH64: ${{ github.workspace }}/gcc-toolchain-aarch64
      # Clang 和 Binutils 设置
      CROSS_COMPILE: aarch64-linux-android-
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev \
            libncurses5-dev libelf-dev curl

      - name: ⬇️ 检出 LineageOS 内核源代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} 
          depth: 1 

      - name: 🛠️ 下载 AOSP 工具链 (已修正)
        run: |
          echo "Cloning AOSP Clang (android14-release)..."
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android14-release $CLANG_PATH
          
          echo "Cloning AOSP GCC for binutils (main branch)..."
          # 使用 'main' 分支来获取 binutils，确保克隆成功
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 -b main $GCC_PATH_AARCH64

      - name: 🛠️ PATH 设置 (关键步骤)
        run: |
          # 必须将 bin 目录添加到 GitHub Actions 的 PATH 中
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH
          echo "$GCC_PATH_AARCH64/bin" >> $GITHUB_PATH

      - name: 🧹 清理构建目录
        run: |
          make O=out mrproper
        working-directory: ${{ env.KERNEL_DIR }}

      - name: ⚙️ 应用内核配置 (sdm670-perf_defconfig)
        run: |
          make O=out sdm670-perf_defconfig
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 🚀 编译内核
        run: |
          # 核心编译步骤：
          # 添加 HOSTCC=gcc 确保编译主机工具时使用系统自带的 GCC
          # 同时使用我们设置的 env 变量 (CC=clang, CROSS_COMPILE, etc.)
          make O=out HOSTCC=gcc -j$(nproc --all)
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 📤 上传编译产物 (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-a14-kernel-xiaomi8se
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
