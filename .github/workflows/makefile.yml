name: Build Xiaomi 8 SE Kernel (LineageOS A14)

on:
  push:
    branches:
      - lineage-21
  workflow_dispatch:

jobs:
  build:
    # 使用最新的 Ubuntu 环境
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_PATH: ${{ github.workspace }}/clang-toolchain
      
      # 核心编译变量：使用 LLVM/Clang 工具链
      CROSS_COMPILE: aarch64-linux-gnu- 
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev \
            libncurses5-dev libelf-dev curl

      - name: ⬇️ 检出 LineageOS 内核源代码
        uses: actions/checkout@v4
        with:
          # 检出当前分支的源代码
          ref: ${{ github.ref_name }} 
          depth: 1 
          # 警告: 如果 'depth' 引起警告，可以尝试用 'fetch-depth: 1' 替换

      - name: 🛠️ 下载 AOSP Clang 工具链 (带 LLVM Binutils)
        run: |
          echo "Cloning AOSP Clang (android14-release)..."
          # 只克隆 Clang 工具链，它包含所有必需的 LLVM Binutils。
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android14-release $CLANG_PATH

      - name: 🛠️ PATH 设置 (将 Clang/LLVM Binutils 添加到路径)
        run: |
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      - name: 🧹 清理构建目录
        run: |
          make O=out mrproper
        working-directory: ${{ env.KERNEL_DIR }}

      - name: ⚙️ 应用内核配置 (sdm670-perf_defconfig)
        run: |
          # 1. 应用 defconfig，使用 LLVM 预设
          make O=out LLVM=1 HOSTCC=gcc sdm670-perf_defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        
      - name: 🩹 修正配置 (解决 CONFIG_CC_STACKPROTECTOR_STRONG 错误)
        run: |
          echo "Patching .config to use REGULAR stack protector..."
          # 将冲突的堆栈保护选项降级为 REGULAR，以兼容 LLVM 编译器
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_REGULAR=y/g' out/.config
          
          # 2. 强制静默更新配置，使修改生效并解决依赖
          make O=out LLVM=1 HOSTCC=gcc silentoldconfig
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 🚀 编译内核 (使用 LLVM 模式)
        run: |
          # 编译主机工具使用系统自带的 GCC (HOSTCC=gcc)，核心代码使用 Clang/LLVM (LLVM=1)
          make O=out LLVM=1 HOSTCC=gcc -j$(nproc --all)
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 📤 上传编译产物 (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-a14-kernel-xiaomi8se
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
