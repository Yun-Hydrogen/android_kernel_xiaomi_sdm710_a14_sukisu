name: Build Xiaomi 8 SE Kernel (LineageOS A14) - 最终 LLVM 修正

on:
  push:
    branches:
      - lineage-21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_PATH: ${{ github.workspace }}/clang-toolchain
      
      # 核心编译变量：使用 LLVM/Clang 工具链
      CROSS_COMPILE: aarch64-linux-gnu- 
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev \
            libncurses5-dev libelf-dev curl

      - name: ⬇️ 检出 LineageOS 内核源代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} 
          depth: 1 

      - name: 🛠️ 下载 AOSP Clang 工具链 (带 LLVM Binutils)
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android14-release $CLANG_PATH

      - name: 🛠️ PATH 设置 (将 Clang/LLVM Binutils 添加到路径)
        run: |
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      - name: 🛠️ 设置 LLVM Binutils 强制路径 (解决 Assembler 错误)
        run: |
          # 强制 Make 系统使用 LLVM 工具
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AS=clang" >> $GITHUB_ENV # Clang 可以作为汇编器
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV

      - name: 🧹 清理构建目录
        run: |
          make O=out mrproper
        working-directory: ${{ env.KERNEL_DIR }}

      - name: ⚙️ 应用内核配置 (sdm670-perf_defconfig)
        # 此时假设您已手动修改 defconfig 文件，移除了 CONFIG_CC_STACKPROTECTOR_*
        run: |
          make O=out LLVM=1 sdm670-perf_defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        
      - name: 🩹 修正配置 (最终清理)
        run: |
          make O=out LLVM=1 silentoldconfig
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 🚀 编译内核 (最终 LLVM 模式)
        run: |
          # 移除 HOSTCC=gcc
          make O=out LLVM=1 -j$(nproc --all)
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 📤 上传编译产物 (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-a14-kernel-xiaomi8se
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
