name: Build Xiaomi 8 SE Kernel (LineageOS A14)

on:
  push:
    branches:
      - lineage-21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_PATH: ${{ github.workspace }}/clang-toolchain
      
      # 核心编译变量：使用 LLVM/Clang 工具链
      # 注意：CROSS_COMPILE 仍需设置，但路径只包含 Clang
      CROSS_COMPILE: aarch64-linux-gnu- 
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev \
            libncurses5-dev libelf-dev curl

      - name: ⬇️ 检出 LineageOS 内核源代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} 
          depth: 1 

      - name: 🛠️ 下载 AOSP Clang 工具链 (带 LLVM Binutils)
        run: |
          echo "Cloning AOSP Clang (android14-release)..."
          # 只克隆 Clang 工具链。它包含了 LLVM 自己的 Binutils (如 llvm-ld, llvm-as)。
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android14-release $CLANG_PATH

      - name: 🛠️ PATH 设置 (关键步骤)
        run: |
          # 仅将 Clang 的 bin 目录添加到 PATH 中
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      - name: 🧹 清理构建目录
        run: |
          make O=out mrproper
        working-directory: ${{ env.KERNEL_DIR }}

      - name: ⚙️ 应用内核配置 (sdm670-perf_defconfig)
        run: |
          # 使用 LLVM=1 和 HOSTCC=gcc 预设进行配置
          make O=out LLVM=1 HOSTCC=gcc sdm670-perf_defconfig
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 🚀 编译内核 (使用 LLVM 模式)
        run: |
          # 核心编译：添加 LLVM=1 参数，强制使用 LLVM Binutils
          # HOSTCC=gcc 确保编译主机工具时使用系统自带的 GCC
          make O=out LLVM=1 HOSTCC=gcc -j$(nproc --all)
        working-directory: ${{ env.KERNEL_DIR }}

      - name: 📤 上传编译产物 (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-a14-kernel-xiaomi8se
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
